<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026年のふりかえり | 楽天カードアプリ改修案</title>
  <link rel="stylesheet" href="assets/common.css?v=20260818c" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --brand:#bf0000; --warm:#e8590c; }
    body {
      background: #1a1a1f; color: #fff;
      font-family: "Hiragino Sans", "Yu Gothic UI", -apple-system, "Noto Sans JP", Meiryo, sans-serif;
    }
    button { font: inherit; cursor: pointer; }
    .num { font-variant-numeric: tabular-nums; }

    .wrap { max-width: 480px; margin: 0 auto; padding: 0 14px; }

    /* ===== 版の切替（上部） ===== */
    .modebar {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      background: #26262e; border: 1px solid #3a3a45; border-radius: 14px;
      padding: 8px; margin-bottom: 12px;
    }
    .modebtn {
      border: 1px solid #3a3a45; background: #1f1f26; color: #cfd2d8;
      border-radius: 10px; padding: 11px 8px; text-align: center; line-height: 1.35;
      transition: background .15s, border-color .15s, transform .1s;
    }
    .modebtn:hover  { background: #2c2c35; }
    .modebtn:active { transform: scale(.97); }
    .modebtn strong { display: block; font-size: 13.5px; margin-bottom: 3px; }
    .modebtn span   { font-size: 10.5px; opacity: .75; display: block; }
    .modebtn[aria-pressed="true"] {
      background: linear-gradient(135deg, var(--brand), var(--warm));
      border-color: transparent; color: #fff;
    }

    /* ===== プレイヤー（ショート動画の見立て） ===== */
    .player {
      position: relative; width: 100%; aspect-ratio: 9 / 16;
      border-radius: 20px; overflow: hidden; background: #101014;
      box-shadow: 0 24px 60px -20px rgba(0,0,0,.8);
      user-select: none; -webkit-user-select: none;
    }
    .stage {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      justify-content: center; padding: 74px 26px 96px; transition: background .5s;
    }

    .bars { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; gap: 4px; z-index: 6; }
    .bar { flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,.28); overflow: hidden; }
    .bar i { display: block; height: 100%; width: 0; background: #fff; border-radius: 2px; }
    .bar.done i { width: 100%; }

    .topline {
      position: absolute; top: 26px; left: 16px; right: 16px; z-index: 6;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .who { display: flex; align-items: center; gap: 8px; font-size: 11.5px; opacity: .92; }
    .who .ava {
      width: 28px; height: 28px; border-radius: 50%; overflow: hidden; background: #fff;
      display: flex; align-items: center; justify-content: center; font-size: 15px; flex: none;
    }
    .who .ava img { width: 100%; height: 100%; object-fit: contain; }
    .closebtn { color: #fff; font-size: 20px; opacity: .8; line-height: 1; padding: 2px 6px; text-decoration: none; }
    .closebtn:hover { opacity: 1; }

    .tap { position: absolute; top: 0; bottom: 74px; z-index: 5; background: transparent; border: none; }
    .tap.prev { left: 0; width: 34%; }
    .tap.next { left: 34%; width: 66%; }

    .controls {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 7;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px));
      background: linear-gradient(0deg, rgba(0,0,0,.55), rgba(0,0,0,0));
    }
    .ctrl {
      background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.22);
      color: #fff; border-radius: 999px; padding: 8px 14px; font-size: 12px; font-weight: 700;
    }
    .ctrl:hover { background: rgba(255,255,255,.24); }
    .hintline { font-size: 10.5px; opacity: .7; text-align: center; margin-top: 10px; line-height: 1.7; }

    /* ===== スライドの中身 ===== */
    .kicker { font-size: 12px; letter-spacing: .16em; opacity: .8; margin-bottom: 10px; }
    .huge   { font-size: 50px; font-weight: 800; letter-spacing: -.03em; line-height: 1.08; }
    .huge small { font-size: 24px; font-weight: 700; }
    .big    { font-size: 32px; font-weight: 800; letter-spacing: -.02em; line-height: 1.2; }
    .sub    { font-size: 13px; opacity: .88; line-height: 1.75; margin-top: 12px; }
    .tag {
      display: inline-block; align-self: flex-start;
      background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.28);
      border-radius: 999px; padding: 5px 12px; font-size: 11.5px; font-weight: 700; margin-bottom: 12px;
    }
    .fade > * { animation: rise .5s cubic-bezier(.2,.7,.3,1) both; }
    .fade > *:nth-child(2) { animation-delay: .08s; }
    .fade > *:nth-child(3) { animation-delay: .16s; }
    .fade > *:nth-child(4) { animation-delay: .24s; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .fade > * { animation: none; } }

    .months { display: flex; align-items: flex-end; gap: 4px; height: 120px; margin-top: 10px; }
    .mcol { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
    .mbar { width: 100%; border-radius: 3px 3px 0 0; background: rgba(255,255,255,.35); }
    .mbar.top { background: linear-gradient(180deg, #ffd08a, var(--warm)); }
    .mlab { font-size: 8.5px; opacity: .7; }

    .rows { margin-top: 10px; }
    .row {
      display: grid; grid-template-columns: 20px 1fr auto; gap: 10px; align-items: center;
      padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,.14); font-size: 13px;
    }
    .row:last-child { border-bottom: none; }
    .rank { font-size: 15px; font-weight: 800; opacity: .55; }
    .rname { font-weight: 700; }
    .rsub { font-size: 10.5px; opacity: .7; margin-top: 2px; }
    .ramt { font-weight: 700; }
    .meter { height: 6px; border-radius: 3px; background: rgba(255,255,255,.2); overflow: hidden; margin-top: 5px; }
    .meter i { display: block; height: 100%; border-radius: 3px; background: #fff; }

    .note-panel { margin-top: 14px; background: #26262e; border: 1px solid #3a3a45; border-radius: 14px; padding: 14px; }
    .note-panel h2 { font-size: 13.5px; margin-bottom: 8px; color: #ffb3b3; }
    .note-panel p  { font-size: 12px; line-height: 1.8; opacity: .85; }
    .backlink { display: block; text-align: center; margin: 14px 0 6px; color: #cfd2d8; font-size: 12.5px; font-weight: 700; text-decoration: none; }
    .backlink:hover { color: #fff; }

    /* ===== Web版：プレイヤーを左、説明を右に並べる ===== */
    body.device-web .wrap {
      max-width: 980px; display: grid; grid-template-columns: 360px 1fr;
      gap: 26px; align-items: start;
    }
    body.device-web .modebar { grid-column: 1 / -1; max-width: 520px; }
    body.device-web .player  { max-width: 360px; }
    body.device-web .hintline { text-align: left; margin-top: 0; }
    body.device-web .backlink { text-align: left; }
    @media (max-width: 820px) {
      body.device-web .wrap { grid-template-columns: 1fr; }
      body.device-web .modebar, body.device-web .player { max-width: none; }
    }
  </style>
</head>
<body data-screen="recap">

<div class="wrap">
  <div class="modebar" role="group" aria-label="サマリーの版">
    <button class="modebtn" data-mode="short" aria-pressed="true"></button>
    <button class="modebtn" data-mode="basic" aria-pressed="false"></button>
  </div>

  <div class="player" id="player">
    <div class="bars" id="bars"></div>
    <div class="topline">
      <div class="who"><span class="ava" id="ava"></span><span id="whoName"></span></div>
      <a class="closebtn" data-rk-link="top.html" href="top.html" aria-label="閉じる">&times;</a>
    </div>

    <div class="stage fade" id="stage"></div>

    <button class="tap prev" id="tapPrev" aria-label="前へ"></button>
    <button class="tap next" id="tapNext" aria-label="次へ"></button>

    <div class="controls">
      <button class="ctrl" id="playBtn">⏸ 一時停止</button>
      <button class="ctrl" id="replayBtn">↻ 最初から</button>
    </div>
  </div>

  <div class="side">
  <div class="hintline">
    画面の右側をタップで次へ／左側で前へ。長押しで一時停止します。<br>
    <span id="modeNote"></span>
  </div>

  <div class="note-panel">
    <h2>この機能について</h2>
    <p>
      1年ぶんの利用実績をまとめて見せる、年末限定の機能です。
      <b>ライト・ミドル・ヘビーで内容を変えていません。</b>
      1年ぶんの事実そのものなので、使用頻度によって隠す理由がないためです。
      分けているのは「サクッと版／じっくり版」という、ユーザー自身が選ぶ軸だけです。
    </p>
  </div>

  <a class="backlink" data-rk-link="top.html" href="top.html">← TOPにもどる</a>
  </div>
</div>

<script src="assets/data.js?v=20260818c"></script>
<script src="assets/common.js?v=20260818c"></script>
<script>
(function () {
  var C = APP.C, yen = APP.yen, R = APP.recapStats();
  var el = function (id) { return document.getElementById(id); };
  var mode = new URLSearchParams(location.search).get("mode") === "basic" ? "basic" : "short";
  var idx = 0, playing = true, raf = null, slideStart = 0, held = 0;

  function talkLine(kind) {
    var t = APP.TALK[RK.char()];
    return (t && t.recap && t.recap[kind]) || "";
  }

  /* ---------- スライド定義 ----------
     じっくり版は全11枚、サクッと版はそのうち short:true の6枚。
     数字はどちらも同じものを使う（＝粒度は変えない）。 */
  var SLIDES = [
    { id: "open", short: true, bg: "linear-gradient(160deg,#7d0000,#bf0000 55%,#e8590c)",
      html: function () {
        return '<div class="kicker">' + R.year + " RAKUTEN CARD</div>" +
               '<div class="huge">1年の<br>ふりかえり</div>' +
               '<div class="sub">' + talkLine("open") + "</div>";
      } },

    { id: "total", short: true, bg: "linear-gradient(160deg,#8e0000,#d4121a 60%,#ff8a5b)",
      html: function () {
        return '<div class="kicker">年間のご利用金額</div>' +
               '<div class="huge"><span id="cnt">¥0</span></div>' +
               '<div class="sub">' + R.count + "回のお買いもの。1回あたり平均 " + yen(R.avgPerUse) + "。</div>";
      },
      anim: function () { countUp(el("cnt"), R.total); } },

    { id: "trend", short: false, bg: "linear-gradient(160deg,#3b1d5e,#7b2f6a 60%,#c2410c)",
      html: function () {
        var max = Math.max.apply(null, R.months.map(function (m) { return m.total; }));
        return '<div class="kicker">月ごとのご利用</div>' +
               '<div class="big">いちばん使ったのは<br>' + R.best.short + "</div>" +
               '<div class="months">' + R.months.map(function (m) {
                 return '<div class="mcol"><div class="mbar' + (m.short === R.best.short ? " top" : "") +
                        '" style="height:' + Math.round((m.total / max) * 100) + '%"></div>' +
                        '<div class="mlab">' + m.short.replace("月", "") + "</div></div>";
               }).join("") + "</div>" +
               '<div class="sub">' + R.best.short + "は " + yen(R.best.total) +
               "。いちばん静かだったのは" + R.quiet.short + "の " + yen(R.quiet.total) + "でした。</div>";
      } },

    { id: "prev", short: false, bg: "linear-gradient(160deg,#12343b,#2d6a4f 60%,#95d5b2)",
      html: function () {
        var up = R.diff > 0;
        return '<div class="kicker">前の年とくらべると</div>' +
               '<div class="huge">' + (up ? "+" : "") + yen(R.diff) + "</div>" +
               '<div class="sub">' + (R.year - 1) + "年は " + yen(R.prev) + "。今年は " +
               Math.abs(R.diffRate) + "% " + (up ? "増えました" : "減りました") + "。</div>";
      } },

    { id: "cat", short: true, bg: "linear-gradient(160deg,#4a1010,#bf0000 65%,#ffb703)",
      html: function () {
        var top = R.categories[0];
        return '<div class="kicker">いちばん使ったジャンル</div>' +
               '<div class="huge">' + top.key + "</div>" +
               '<div class="sub">' + yen(top.amount) + " ／ 支出全体の " + R.catRate + "%</div>" +
               '<div class="rows">' + R.categories.slice(0, 4).map(function (c) {
                 return '<div class="row"><span class="rank"></span>' +
                        '<span><span class="rname">' + c.key + "</span>" +
                        '<div class="meter"><i style="width:' + Math.round((c.amount / top.amount) * 100) + '%"></i></div></span>' +
                        '<span class="ramt num">' + yen(c.amount) + "</span></div>";
               }).join("") + "</div>";
      } },

    { id: "shops", short: false, bg: "linear-gradient(160deg,#1f2937,#4b5563 60%,#e8590c)",
      html: function () {
        return '<div class="kicker">よく行ったお店</div>' +
               '<div class="big">' + R.shops[0].name + "</div>" +
               '<div class="rows">' + R.shops.slice(0, 3).map(function (sh, i) {
                 return '<div class="row"><span class="rank">' + (i + 1) + "</span>" +
                        '<span><span class="rname">' + sh.name + '</span>' +
                        '<div class="rsub">' + sh.count + "回</div></span>" +
                        '<span class="ramt num">' + yen(sh.amount) + "</span></div>";
               }).join("") + "</div>" +
               '<div class="sub">' + R.topWeekday + "の" + R.topHour + "が、いちばん使う時間でした。</div>";
      } },

    { id: "biggest", short: false, bg: "linear-gradient(160deg,#0f2027,#203a43 60%,#bf0000)",
      html: function () {
        var b = R.biggest;
        return '<div class="kicker">今年いちばん大きな買いもの</div>' +
               '<div class="huge">' + yen(b.amount) + "</div>" +
               '<div class="sub">' + RK.ymd(b.date) + "　" + b.shop + "（" + b.method + "）</div>";
      } },

    { id: "method", short: false, bg: "linear-gradient(160deg,#3d2c1e,#8a5a2b 60%,#e8590c)",
      html: function () {
        var max = R.methods[0].amount;
        return '<div class="kicker">お支払い方法の内訳</div>' +
               '<div class="big">分割・リボが ' + R.revoRate + "%</div>" +
               '<div class="rows">' + R.methods.map(function (m) {
                 return '<div class="row"><span class="rank"></span>' +
                        '<span><span class="rname">' + m.key + "</span>" +
                        '<div class="meter"><i style="width:' + Math.round((m.amount / max) * 100) + '%"></i></div></span>' +
                        '<span class="ramt num">' + yen(m.amount) + "</span></div>";
               }).join("") + "</div>" +
               '<div class="sub">1年間の手数料は ' + yen(R.fee) + "。支払い方法を見直すと減らせます。</div>";
      } },

    { id: "point", short: true, bg: "linear-gradient(160deg,#2b1055,#7597de 60%,#ffd166)",
      html: function () {
        var p = R.points;
        return '<div class="kicker">今年ためたポイント</div>' +
               '<div class="huge"><span id="pcnt">0</span><small>pt</small></div>' +
               '<div class="sub">うちキャンペーン分 ' + p.campaign.toLocaleString("ja-JP") + "pt。" +
               p.used.toLocaleString("ja-JP") + "pt を使いました。" +
               (p.expired ? "<br>失効してしまったのは " + p.expired.toLocaleString("ja-JP") + "pt でした。" : "") +
               "</div>";
      },
      anim: function () { countUp(el("pcnt"), R.points.earned, true); } },

    { id: "type", short: true, bg: "linear-gradient(160deg,#5a189a,#c1121f 60%,#ff8a5b)",
      html: function () {
        return '<div class="tag">あなたのタイプ</div>' +
               '<div class="huge">' + R.type + "</div>" +
               '<div class="sub">' + R.typeNote + "</div>";
      } },

    { id: "close", short: true, bg: "linear-gradient(160deg,#bf0000,#e8590c 60%,#ffd166)",
      html: function () {
        return '<div class="kicker">' + R.year + " ありがとうございました</div>" +
               '<div class="big">' + talkLine("close") + "</div>" +
               '<div class="sub">来年のふりかえりは ' + (R.year + 1) + "年12月に出ます。</div>";
      } }
  ];

  function list() {
    return mode === "short" ? SLIDES.filter(function (s) { return s.short; }) : SLIDES;
  }

  function countUp(node, target, plain) {
    if (!node) return;
    var t0 = performance.now(), dur = 900;
    (function step() {
      var k = Math.min((performance.now() - t0) / dur, 1);
      var v = Math.round(target * (1 - Math.pow(1 - k, 3)));
      node.textContent = plain ? v.toLocaleString("ja-JP") : yen(v);
      if (k < 1) requestAnimationFrame(step);
    })();
  }

  function slideMs() { return C.recap.modes[mode].slideMs; }

  function renderBars() {
    el("bars").innerHTML = list().map(function (_, i) {
      return '<div class="bar' + (i < idx ? " done" : "") + '"><i></i></div>';
    }).join("");
  }

  function show() {
    var s = list()[idx];
    el("stage").style.background = s.bg;
    el("stage").innerHTML = s.html();
    el("stage").classList.remove("fade");
    void el("stage").offsetWidth;
    el("stage").classList.add("fade");
    if (s.anim) s.anim();
    renderBars();
    slideStart = performance.now();
    held = 0;
    if (playing) tick();
  }

  function tick() {
    cancelAnimationFrame(raf);
    (function loop() {
      var bar = el("bars").children[idx];
      if (!bar) return;
      var k = Math.min((performance.now() - slideStart - held) / slideMs(), 1);
      bar.firstChild.style.width = (k * 100) + "%";
      if (k >= 1) {
        if (idx < list().length - 1) { idx++; show(); } else { pause(); }
        return;
      }
      if (playing) raf = requestAnimationFrame(loop);
    })();
  }

  function go(d) {
    var n = idx + d;
    if (n < 0 || n >= list().length) return;
    idx = n;
    show();
  }

  function pause() {
    playing = false;
    cancelAnimationFrame(raf);
    el("playBtn").textContent = "▶ 再生";
  }

  function play() {
    playing = true;
    el("playBtn").textContent = "⏸ 一時停止";
    show();
  }

  function renderModeBar() {
    document.querySelectorAll(".modebtn").forEach(function (b) {
      var m = C.recap.modes[b.dataset.mode];
      b.innerHTML = "<strong>" + m.label + "</strong><span>" + m.sub + " ／ " + m.note + "</span>";
      b.setAttribute("aria-pressed", b.dataset.mode === mode ? "true" : "false");
    });
    var m = C.recap.modes[mode];
    el("modeNote").textContent =
      m.label + "は全" + list().length + "枚・1枚" + (m.slideMs / 1000) + "秒（合計 約" +
      Math.round(list().length * m.slideMs / 1000) + "秒）です。どちらも中身の数字は同じです。";
  }

  function setMode(m) {
    mode = m;
    idx = 0;
    renderModeBar();
    play();
  }

  function paintWho() {
    el("ava").innerHTML = RK.face(RK.char());
    el("whoName").textContent = C.characters[RK.char()].label;
  }

  /* ---------- 操作 ---------- */
  document.querySelectorAll(".modebtn").forEach(function (b) {
    b.addEventListener("click", function () { setMode(b.dataset.mode); });
  });
  el("tapPrev").addEventListener("click", function () { go(-1); });
  el("tapNext").addEventListener("click", function () { go(1); });
  el("playBtn").addEventListener("click", function () { playing ? pause() : play(); });
  el("replayBtn").addEventListener("click", function () { idx = 0; play(); });

  /* 長押しで一時停止 */
  var holdStart = 0, holdTimer = null;
  ["mousedown", "touchstart"].forEach(function (ev) {
    el("player").addEventListener(ev, function () {
      holdTimer = setTimeout(function () {
        holdStart = performance.now();
        cancelAnimationFrame(raf);
      }, 220);
    }, { passive: true });
  });
  ["mouseup", "touchend", "mouseleave"].forEach(function (ev) {
    el("player").addEventListener(ev, function () {
      clearTimeout(holdTimer);
      if (holdStart) {
        held += performance.now() - holdStart;
        holdStart = 0;
        if (playing) tick();
      }
    }, { passive: true });
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1);
    if (e.key === "ArrowLeft") go(-1);
    if (e.key === " ") { e.preventDefault(); playing ? pause() : play(); }
  });

  /* キャラクターを変えたら、ナレーションの入っている面だけ描き直す */
  document.addEventListener("rk:state", function () {
    paintWho();
    var id = list()[idx].id;
    if (id === "open" || id === "close") el("stage").innerHTML = list()[idx].html();
  });

  paintWho();
  renderModeBar();
  show();
})();
</script>
</body>
</html>
