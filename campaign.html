<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>キャンペーン | 楽天カードアプリ改修案</title>
  <link rel="stylesheet" href="assets/common.css?v=20260818c" />
  <style>
    /* 他の画面（家計簿・明細）と同じ作りに揃えています。
       この画面だけ独自のライト／ヘビー切替を持っていましたが、
       表示モードは「登録情報 → 表示設定」に一本化しました。 */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --brand: #bf0000; --brand-dark: #8e0000; --warm: #e8590c; --ink: #222; --ink-2: #555; --ink-3: #888; --line: #e6e8ec; }
    body {
      background: #f4f5f7; color: var(--ink);
      font-family: "Hiragino Sans", "Yu Gothic UI", -apple-system, "Noto Sans JP", Meiryo, sans-serif;
    }
    button { font: inherit; cursor: pointer; }
    .num { font-variant-numeric: tabular-nums; }
    .app { max-width: 480px; margin: 0 auto; min-height: 100vh; }

    /* ===== ヘッダー（家計簿と同じ） ===== */
    header.hero {
      background: linear-gradient(135deg, var(--brand), #e84c3d);
      color: #fff; padding: 18px 16px 20px;
      border-radius: 0 0 24px 24px; box-shadow: 0 8px 24px rgba(191,0,0,.25);
    }
    header.hero .mini { font-size: 10.5px; opacity: .85; letter-spacing: .1em; }
    header.hero h1 { font-size: 22px; margin: 4px 0 6px; }
    header.hero p { font-size: 12px; opacity: .95; line-height: 1.6; }

    .content { padding: 14px; }

    /* ===== カード（家計簿の .section と同じ） ===== */
    .section { background: #fff; border-radius: 14px; padding: 14px; margin-bottom: 14px; box-shadow: 0 3px 12px rgba(0,0,0,.07); }
    .section-title { font-size: 14.5px; font-weight: bold; color: var(--brand); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    .section-sub { font-size: 11.5px; color: var(--ink-3); line-height: 1.6; margin-bottom: 10px; }

    /* ===== おすすめ分析 ===== */
    .reco {
      background: #fff4ec; border: 1px solid #ffd8bd; color: #9a4a00;
      border-radius: 12px; padding: 11px 13px; margin-bottom: 14px;
      font-size: 11.5px; line-height: 1.7;
    }
    .reco b { color: var(--brand); }

    /* ===== ジャンルタブ（TOP画面の chip と同じ） ===== */
    .chips { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
    .chip-btn {
      font-size: 12px; padding: 7px 14px; border-radius: 999px;
      border: 1px solid var(--line); background: #fff; color: var(--ink-2);
      font-weight: 600; transition: all .15s;
    }
    .chip-btn:hover { border-color: var(--brand); color: var(--brand); }
    .chip-btn.on { background: var(--brand); border-color: var(--brand); color: #fff; }

    /* ===== 注目キャンペーン ===== */
    .feature { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; text-decoration: none; color: inherit; display: block; }
    .feature:hover { border-color: var(--brand); }
    .feature-img {
      width: 100%; height: 120px; object-fit: cover; display: block;
      background: linear-gradient(120deg, var(--brand), var(--warm));
    }
    .img-fallback {
      width: 100%; height: 120px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: bold; font-size: 15px; letter-spacing: .08em;
      background: linear-gradient(120deg, var(--brand), var(--warm));
    }
    .feature-body { padding: 13px 14px; }
    .feature-genre { font-size: 10.5px; font-weight: 700; color: var(--ink-3); }
    .feature-store { font-size: 16px; font-weight: bold; margin: 4px 0 6px; }
    .feature-rate { font-size: 26px; font-weight: 800; color: var(--brand); letter-spacing: -.02em; }
    .feature-meta { font-size: 11.5px; color: var(--ink-3); margin-top: 6px; }
    .badge-soon {
      display: inline-block; margin-top: 8px; background: var(--warm-soft, #fff4ec);
      border: 1px solid #ffd8bd; color: #9a4a00;
      padding: 4px 10px; border-radius: 999px; font-size: 10.5px; font-weight: 700;
    }

    /* ===== 一覧の行（TOP画面のキャンペーン行と同じ） ===== */
    .cp {
      display: flex; align-items: center; gap: 12px; padding: 11px 10px;
      border-radius: 10px; border: 1px solid #eee; margin-bottom: 8px;
      text-decoration: none; color: inherit;
      transition: border-color .15s, background .15s, transform .1s;
    }
    .cp:last-child { margin-bottom: 0; }
    .cp:hover { border-color: #f3caca; background: #fff0f0; transform: translateX(2px); }
    .cp-rate { flex: none; width: 58px; text-align: center; font-size: 21px; font-weight: 800; color: var(--brand); line-height: 1.1; }
    .cp-rate span { font-size: 10.5px; font-weight: 700; display: block; }
    .cp-body { flex: 1; min-width: 0; }
    .cp-store { font-size: 13.5px; font-weight: 700; }
    .cp-meta { font-size: 11px; color: var(--ink-3); margin-top: 3px; }
    .cp-tag {
      display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 7px;
      border-radius: 5px; background: #f1f3f5; color: var(--ink-2); border: 1px solid var(--line);
    }
    .cp-tag.match { background: #fff0f0; color: var(--brand); border-color: #f3caca; }
    .cp-tag.soon  { background: #fff4ec; color: #9a4a00; border-color: #ffd8bd; }

    /* ===== 検索（明細画面と同じ） ===== */
    .search-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    .search-row input {
      width: 100%; height: 42px; border: 1px solid #d9dee8; border-radius: 10px;
      padding: 0 12px; font-size: 14px; font-family: inherit; background: #fff;
    }
    .search-row input:focus { outline: none; border-color: var(--brand); }
    .btn-primary {
      height: 42px; padding: 0 18px; border: none; border-radius: 10px;
      background: var(--brand); color: #fff; font-size: 13px; font-weight: bold;
    }
    .btn-primary:hover { background: var(--brand-dark); }
    .btn-ghost {
      width: 100%; height: 40px; margin-top: 8px; background: #fff; color: var(--ink-2);
      border: 1px solid var(--line); border-radius: 10px; font-size: 12.5px; font-weight: 600;
    }
    .btn-ghost:hover { border-color: var(--brand); color: var(--brand); background: #fff0f0; }
    .no-result {
      display: none; margin-top: 12px; padding: 11px 13px; border-radius: 10px;
      background: #fff0f0; border: 1px solid #f3b2b2; color: #b30000;
      font-size: 12.5px; font-weight: 700;
    }
    .no-result.show { display: block; }

    /* ===== 表（明細画面と同じ） ===== */
    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
    table { width: 100%; border-collapse: collapse; min-width: 520px; }
    th, td { padding: 11px 10px; text-align: left; border-bottom: 1px solid #eef1f5; font-size: 12px; white-space: nowrap; }
    th { background: #f7f8fb; color: var(--ink-2); font-weight: bold; font-size: 11.5px; }
    tbody tr:hover { background: #fffafa; }
    tbody tr.match { background: #fff8f8; }
    td.rate { font-weight: bold; color: var(--brand); text-align: right; }
    td a { color: inherit; text-decoration: none; font-weight: 700; }
    td a:hover { color: var(--brand); text-decoration: underline; }

    .empty { padding: 18px 12px; text-align: center; font-size: 12.5px; color: var(--ink-3); }
  </style>
</head>
<body data-screen="campaign">

<div class="app">
  <header class="hero">
    <div class="mini">RAKUTEN CARD APP</div>
    <h1>キャンペーン</h1>
    <p>よく使うジャンルから、おすすめの特典を表示します。使うほど表示が育ちます。</p>
  </header>

  <div class="content" data-web-cols>

    <!-- おすすめ分析 -->
    <div class="reco" id="recommendBox" data-web-full></div>

    <!-- ジャンルの絞り込み -->
    <div class="chips" id="genreTabs" data-web-full></div>

    <!-- 検索（ミドル以上） -->
    <section class="section" data-tier="mid heavy" data-web-full>
      <div class="section-title"><span>🔍</span>キャンペーンを探す</div>
      <div class="section-sub">店舗名の一部でも検索できます。ジャンルの絞り込みと組み合わせられます。</div>
      <div class="search-row">
        <input type="text" id="keyword" placeholder="例：ホテル、店" />
        <button class="btn-primary" id="searchBtn">検索</button>
      </div>
      <button class="btn-ghost" id="resetBtn">条件をリセット</button>
      <div class="no-result" id="noResult">条件に合うキャンペーンが見つかりませんでした。</div>
    </section>

    <!-- 注目（全種別で表示） -->
    <section class="section">
      <div class="section-title"><span>🎁</span>あなたへのおすすめ</div>
      <div class="section-sub" id="featuredSub"></div>
      <div id="featuredCard"></div>
    </section>

    <!-- ジャンル別リスト（ライト・ミドル） -->
    <div data-tier="light mid" id="genreSections"></div>

    <!-- 全件の表（ヘビー） -->
    <section class="section" data-tier="heavy" data-web-full>
      <div class="section-title"><span>📋</span>すべてのキャンペーン</div>
      <div class="section-sub">還元率・期間・獲得しやすさを見比べられます。店舗名を押すと対象ページへ移動します。</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>ジャンル</th><th>店舗名</th><th style="text-align:right">還元率</th><th>期限</th><th>残り</th></tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </section>
  </div>
</div>

<script src="assets/data.js?v=20260818c"></script>
<script src="assets/common.js?v=20260818c"></script>
<script>
(function () {
  var C = APP.C, el = function (id) { return document.getElementById(id); };

  /* ジャンルごとの画像。無い場合はジャンル名の色帯で代替します。 */
  var GENRE_IMG = { "旅行": "travel.jpg", "ショッピング": "shopping.jpg", "グルメ": "gourmet.jpg" };
  var GENRES = ["すべて"].concat(APP.CAMPAIGNS.map(function (c) { return c.genre; })
    .filter(function (g, i, a) { return a.indexOf(g) === i; }));

  var genre = "すべて";
  var keyword = "";

  /* ---------- おすすめジャンルの学習 ----------
     押した回数を貯めて、いちばん多いジャンルをおすすめにします。
     まだ一度も押していない人は、ご利用明細でいちばん多いジャンルを使います。 */
  var KEY = "campaignUsageStats";

  function stats() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { return {}; }
  }
  function tapped() { return Object.keys(stats()).length > 0 && localStorage.getItem(KEY + "-tapped") === "1"; }

  function seedGenre() {
    return (APP.topGenre && APP.topGenre()) || "ショッピング";
  }

  function recommendedGenre() {
    var s = stats();
    var top = Object.keys(s).sort(function (a, b) { return s[b] - s[a]; })[0];
    return top || seedGenre();
  }

  function track(g) {
    try {
      var s = stats();
      s[g] = (s[g] || 0) + 1;
      localStorage.setItem(KEY, JSON.stringify(s));
      localStorage.setItem(KEY + "-tapped", "1");
    } catch (e) {}
    render();
  }

  /* ---------- 表示するキャンペーンの絞り込み ---------- */
  function visible() {
    var my = recommendedGenre();
    return APP.CAMPAIGNS.filter(function (c) {
      var g = (genre === "すべて" || c.genre === genre);
      var k = !keyword || c.store.indexOf(keyword) >= 0;
      return g && k;
    }).sort(function (a, b) {
      var am = a.genre === my ? 1 : 0, bm = b.genre === my ? 1 : 0;
      return (bm - am) || (b.rate - a.rate);
    });
  }

  var left = function (c) { return APP.daysUntil(c.to); };
  var period = function (c) { return c.to.replace(/-/g, "/"); };

  /* ---------- 部品 ---------- */
  function imgTag(g) {
    var src = GENRE_IMG[g];
    if (!src) return '<div class="img-fallback">' + g + "</div>";
    return '<img class="feature-img" src="' + src + '" alt="' + g + 'のキャンペーン"' +
           " onerror=\"this.outerHTML='<div class=\\\'img-fallback\\\'>" + g + "</div>'\" />";
  }

  function featureCard(c, my) {
    var d = left(c);
    return '<a class="feature" href="' + c.url + '" target="_blank" rel="noopener noreferrer" data-track="' + c.genre + '">' +
           imgTag(c.genre) +
           '<div class="feature-body">' +
           '<div class="feature-genre">' + c.genre + (c.genre === my ? "・よく使うジャンル" : "") + "</div>" +
           '<div class="feature-store">' + c.store + "</div>" +
           '<div class="feature-rate">' + c.rate + "%還元</div>" +
           '<div class="feature-meta">' + period(c) + "まで</div>" +
           (d <= 30 ? '<span class="badge-soon">残り' + d + "日</span>" : "") +
           "</div></a>";
  }

  function row(c, my) {
    var d = left(c);
    return '<a class="cp" href="' + c.url + '" target="_blank" rel="noopener noreferrer" data-track="' + c.genre + '">' +
           '<div class="cp-rate">' + c.rate + "<span>%還元</span></div>" +
           '<div class="cp-body"><div class="cp-store">' + c.store + "</div>" +
           '<div class="cp-meta">' + period(c) + "まで</div>" +
           '<div style="margin-top:5px">' +
           (c.genre === my ? '<span class="cp-tag match">よく使うジャンル</span> ' : '<span class="cp-tag">' + c.genre + "</span> ") +
           (d <= 30 ? '<span class="cp-tag soon">残り' + d + "日</span>" : "") +
           "</div></div></a>";
  }

  /* ---------- 描画 ---------- */
  function render() {
    var my = recommendedGenre();
    var list = visible();

    /* おすすめ分析 */
    el("recommendBox").innerHTML = tapped()
      ? "<b>おすすめ分析：</b>よく押しているジャンルは <b>" + my + "</b> です。このジャンルを上に表示しています。"
      : "<b>おすすめ分析：</b>ご利用明細でいちばん多いジャンルが <b>" + my + "</b> でした。" +
        "気になるキャンペーンを押すほど、あなたに合った表示に変わります。";

    /* ジャンルタブ */
    el("genreTabs").innerHTML = GENRES.map(function (g) {
      return '<button class="chip-btn' + (g === genre ? " on" : "") + '" data-genre="' + g + '">' + g + "</button>";
    }).join("");

    /* 注目：絞り込みの中で還元率がいちばん高いもの */
    var top = list[0];
    el("featuredSub").textContent = top
      ? "いま参加できるなかで、あなたに合うものを1件だけ表示しています。"
      : "";
    el("featuredCard").innerHTML = top
      ? featureCard(top, my)
      : '<div class="empty">条件に合うキャンペーンがありません。</div>';

    /* ジャンル別リスト（注目の1件を除く） */
    var rest = list.slice(1);
    var byGenre = {};
    rest.forEach(function (c) { (byGenre[c.genre] = byGenre[c.genre] || []).push(c); });
    var order = Object.keys(byGenre).sort(function (a, b) {
      return (b === my ? 1 : 0) - (a === my ? 1 : 0);
    });
    el("genreSections").innerHTML = order.length ? order.map(function (g) {
      return '<section class="section"><div class="section-title"><span>' +
             (g === "旅行" ? "✈️" : g === "グルメ" ? "🍴" : "🛍") + "</span>" + g + "</div>" +
             '<div class="section-sub">' + byGenre[g].length + "件</div>" +
             byGenre[g].map(function (c) { return row(c, my); }).join("") + "</section>";
    }).join("") : "";

    /* 全件の表 */
    el("tableBody").innerHTML = list.length ? list.map(function (c) {
      var d = left(c);
      return '<tr class="' + (c.genre === my ? "match" : "") + '">' +
             "<td>" + c.genre + "</td>" +
             '<td><a href="' + c.url + '" target="_blank" rel="noopener noreferrer" data-track="' + c.genre + '">' + c.store + "</a></td>" +
             '<td class="rate">' + c.rate + "%</td>" +
             "<td>" + period(c) + "</td>" +
             '<td style="color:' + (d <= 30 ? "#9a4a00" : "#888") + '">' + d + "日</td></tr>";
    }).join("") : '<tr><td colspan="5" class="empty">条件に合うキャンペーンがありません。</td></tr>';

    el("noResult").classList.toggle("show", list.length === 0);
  }

  /* ---------- 操作 ---------- */
  el("genreTabs").addEventListener("click", function (e) {
    var b = e.target.closest("[data-genre]");
    if (!b) return;
    genre = b.dataset.genre;
    render();
  });

  el("searchBtn").addEventListener("click", function () {
    keyword = el("keyword").value.trim();
    render();
  });
  el("keyword").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { keyword = el("keyword").value.trim(); render(); }
  });
  el("resetBtn").addEventListener("click", function () {
    keyword = ""; genre = "すべて"; el("keyword").value = "";
    render();
    RK.toast("条件をリセットしました");
  });

  /* キャンペーンを押したら、そのジャンルを学習する */
  document.addEventListener("click", function (e) {
    var a = e.target.closest("[data-track]");
    if (a) track(a.dataset.track);
  });

  /* 表示モードが変わったら描き直す（登録情報 → 表示設定で切り替え） */
  document.addEventListener("rk:state", render);

  render();
})();
</script>
</body>
</html>
